name: PiliNara Baseline Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: 代码迁出
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 构建Java环境
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: 安装Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply patches
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      # 核心修改点：使用 --debug 模式
      # 注意：Debug 模式下通常不使用 --split-per-abi，因为它会生成一个包含全架构的胖 APK
      - name: Flutter Build Debug APK
        run: |
          flutter build apk --debug --no-pub

      - name: Rename Debug APK
        run: |
          mkdir -p output
          if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            mv "build/app/outputs/flutter-apk/app-debug.apk" "output/PiliNara_android_debug_all.apk"
          fi
        shell: bash

      - name: 上传 Debug 产物
        uses: actions/upload-artifact@v7
        with:
          name: Android_Debug_APK
          path: output/PiliNara_android_debug_all.apk
          if-no-files-found: error

  windows-debug:
    name: Windows x64 Debug
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Apply patches
        shell: pwsh
        run: lib/scripts/patch.ps1 windows
      - name: Static analysis
        run: flutter analyze --no-pub
        continue-on-error: true
      - name: Automated tests
        run: flutter test --no-pub --reporter expanded
        continue-on-error: true
      - name: Build Windows debug package
        run: flutter build windows --debug --no-pub
      - uses: actions/upload-artifact@v7
        with:
          name: Windows-x64-debug
          path: build/windows/x64/runner/Debug/
          if-no-files-found: error
