name: PiliNara Baseline Verification

on:
  workflow_dispatch:
    inputs:
      smoke:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  android-debug:
    if: ${{ !inputs.smoke }}
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: 代码迁出
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 构建Java环境
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: 安装Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply patches
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      # 核心修改点：使用 --debug 模式
      # 注意：Debug 模式下通常不使用 --split-per-abi，因为它会生成一个包含全架构的胖 APK
      - name: Flutter Build Debug APK
        run: |
          flutter build apk --debug --no-pub

      - name: Rename Debug APK
        run: |
          mkdir -p output
          if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            mv "build/app/outputs/flutter-apk/app-debug.apk" "output/PiliNara_android_debug_all.apk"
          fi
        shell: bash

      - name: 上传 Debug 产物
        uses: actions/upload-artifact@v7
        with:
          name: Android_Debug_APK
          path: output/PiliNara_android_debug_all.apk
          if-no-files-found: error

  windows-debug:
    if: ${{ !inputs.smoke }}
    name: Windows x64 Debug
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Apply patches
        shell: pwsh
        run: lib/scripts/patch.ps1 windows
      - name: Static analysis
        run: flutter analyze --no-pub
        continue-on-error: true
      - name: Automated tests
        run: flutter test --no-pub --reporter expanded
        continue-on-error: true
      - name: Build Windows debug package
        run: flutter build windows --debug --no-pub
      - uses: actions/upload-artifact@v7
        with:
          name: Windows-x64-debug
          path: build/windows/x64/runner/Debug/
          if-no-files-found: error

  windows-smoke:
    if: ${{ inputs.smoke }}
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: 44292757423
          name: Windows-x64-debug
          path: smoke-package
      - name: Launch Windows package with a clean profile
        shell: pwsh
        run: |
          $package = (Resolve-Path smoke-package).Path
          $app = Start-Process "$package/pilinara.exe" -WorkingDirectory $package -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(60)
            do {
              Start-Sleep -Seconds 2
              $app.Refresh()
              if ($app.HasExited) { throw "App exited during startup: $($app.ExitCode)" }
            } until ($app.MainWindowHandle -ne 0 -or (Get-Date) -ge $deadline)
            if ($app.MainWindowHandle -eq 0) { throw 'The app did not create a main window' }
            Write-Host "Main window: $($app.MainWindowTitle), PID: $($app.Id)"
            Start-Sleep -Seconds 10
            $app.Refresh()
            if ($app.HasExited -or $app.MainWindowHandle -eq 0 -or !$app.Responding) {
              throw 'The main window did not remain responsive'
            }
            Write-Host 'Windows startup smoke test passed'
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id }
          }

  android-smoke:
    if: ${{ inputs.smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: 44292757423
          name: Android_Debug_APK
          path: smoke-package
      - name: Enable access to KVM
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            bash -euo pipefail -c '
              apk=smoke-package/PiliNara_android_debug_all.apk
              analyzer=$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/apkanalyzer" | sort -V | tail -1)
              package=$("$analyzer" manifest application-id "$apk")
              printf "APK package: %s\n" "$package"
              adb install -g "$apk"
              launch=$(adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -p "$package")
              printf "%s\n" "$launch"
              grep -F "Status: ok" <<<"$launch"
              sleep 15
              adb shell pidof "$package"
              adb shell dumpsys activity activities | grep -E "(mResumedActivity|topResumedActivity)" | grep -F "$package/"
            '
